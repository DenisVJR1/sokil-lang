name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload
        required: true
        default: v2.17

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up MinGW
        uses: egor-tensin/setup-mingw@v2

      - name: Build Sokil
        shell: bash
        run: gcc -O2 -std=c99 -o sokil.exe sokil.c -lurlmon -ladvapi32 -luser32 -lshell32

      - name: Upload executable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: sokil.exe
