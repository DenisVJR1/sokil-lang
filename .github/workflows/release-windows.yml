name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload
        required: true
        default: v2.21
      source_ref:
        description: Git ref containing the source to build
        required: true
        default: master

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up MinGW
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          "C:\ProgramData\mingw64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Sokil
        shell: bash
        run: gcc -O2 -std=c99 -o sokil.exe sokil.c -lurlmon -ladvapi32 -luser32 -lshell32

      - name: Build Sokil IDE
        shell: bash
        run: gcc -O2 -mwindows -o SokilIDE.exe ide.c -lcomdlg32 -lcomctl32 -luser32 -lgdi32

      - name: Test aliased modules
        shell: pwsh
        run: |
          Set-Content -Path math.sokil -Value 'fn square(x) { return x * x }'
          $output = & .\sokil.exe -e 'import "math.sokil" as math; print(math.square(5)); print(type(math))'
          if (($output -join "`n") -notmatch '25' -or ($output -join "`n") -notmatch 'модуль') { exit 1 }

      - name: Embed Sokil and build installer
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes("sokil.exe")
          $writer = New-Object IO.StreamWriter("sokil_exe.h", $false, [Text.Encoding]::ASCII)
          $writer.WriteLine("static const unsigned char sokil_exe_data[] = {")
          for ($i = 0; $i -lt $bytes.Length; $i += 20) {
            $end = [Math]::Min($i + 20, $bytes.Length)
            $values = for ($j = $i; $j -lt $end; $j++) { "0x{0:X2}" -f $bytes[$j] }
            $writer.WriteLine(($values -join ",") + ",")
          }
          $writer.WriteLine("};")
          $writer.WriteLine("static const unsigned int sokil_exe_len = $($bytes.Length);")
          $writer.Close()
          windres installer.rc installer.o
          gcc -O2 -municode -mwindows -o Sokil-Setup.exe installer.c installer.o -ldwmapi -lshell32 -lurlmon -lole32 -lcomctl32 -lgdi32 -luser32 -ladvapi32

      - name: Build MSIX package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { $version = '2.21.0' }
          $msixVersion = "$version.0"
          $packageRoot = Join-Path $env:RUNNER_TEMP 'sokil-msix'
          New-Item -ItemType Directory -Force -Path "$packageRoot\Assets" | Out-Null
          Copy-Item sokil.exe, SokilIDE.exe "$packageRoot\"
          Copy-Item store\AppxManifest.xml "$packageRoot\AppxManifest.xml"
          $manifest = Get-Content "$packageRoot\AppxManifest.xml" -Raw
          $manifest = $manifest -replace 'Version="2\.21\.0\.0"', "Version=`"$msixVersion`""
          Set-Content -Path "$packageRoot\AppxManifest.xml" -Value $manifest -Encoding utf8

          Add-Type -AssemblyName System.Drawing
          $bitmap = New-Object System.Drawing.Bitmap 256, 256
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.Clear([System.Drawing.Color]::FromArgb(24, 24, 27))
          $font = New-Object System.Drawing.Font('Arial', 112, [System.Drawing.FontStyle]::Bold)
          $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255, 230, 160))
          $graphics.DrawString('S', $font, $brush, 68, 48)
          $bitmap.Save("$packageRoot\Assets\logo.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose()
          $font.Dispose()
          $brush.Dispose()
          $bitmap.Dispose()

          $makeAppx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeAppx) { throw 'Windows SDK makeappx.exe was not found' }
          & $makeAppx.FullName pack /d $packageRoot /p "$env:GITHUB_WORKSPACE\Sokil-Lang.msix" /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\Sokil-Lang.msix")) {
            throw 'MSIX package was not created'
          }

      - name: Upload executable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            sokil.exe
            SokilIDE.exe
            Sokil-Setup.exe
            Sokil-Lang.msix
